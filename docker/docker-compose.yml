services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - core5g

  nrf:
    image: gradiant/open5gs:2.6.4
    container_name: nrf
    restart: unless-stopped
    command: ["open5gs-nrfd", "-c", "/etc/open5gs/custom/nrf.yaml"]
    volumes:
      - ./config/nrf.yaml:/etc/open5gs/custom/nrf.yaml:ro
    networks:
      - core5g

volumes:
  mongo_data:

networks:
  core5g:
    driver: bridge